name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# 同一 PR 上取消旧的运行
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [20, 22]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - run: npm ci
            - run: npm run format:check
            - run: npm run audit:tokens
            - run: npm run lint

    test:
        name: Test (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [20, 22]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - run: npm ci
            - run: npm run test:run

    quality:
        name: Full quality gate
        runs-on: ubuntu-latest
        needs: [lint, test]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - name: Audit development dependencies (report only)
              continue-on-error: true
              run: npm audit --audit-level=moderate
            - name: Audit production dependencies (gate)
              run: npm audit --omit=dev --audit-level=moderate
            - run: npm run ci
            - run: npm run test:cov
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: coverage
                  path: coverage
                  if-no-files-found: error
                  retention-days: 14

    website_visual_qa:
        name: Website visual QA
        runs-on: ubuntu-latest
        needs: [quality]
        continue-on-error: true
        steps:
            - uses: actions/checkout@v7

            - name: Capture 1440px website QA screenshots
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p website-visual-qa
                  python3 -m http.server 4173 --directory public >/tmp/fresnica-visual-qa.log 2>&1 &
                  server_pid=$!
                  trap 'kill "$server_pid" 2>/dev/null || true' EXIT

                  for attempt in {1..30}; do
                      if curl --fail --silent --show-error http://127.0.0.1:4173/fresnica-website-preview/ >/dev/null; then
                          break
                      fi
                      sleep 0.2
                  done

                  chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
                  if [ -z "$chrome" ]; then
                      echo "No supported Chrome/Chromium executable found." >&2
                      exit 1
                  fi

                  base="http://127.0.0.1:4173/fresnica-website-preview/"
                  common_args=(
                      --headless=new
                      --no-sandbox
                      --disable-gpu
                      --hide-scrollbars
                      --force-device-scale-factor=1
                      --virtual-time-budget=1500
                  )

                  "$chrome" "${common_args[@]}" --window-size=1440,1000 --screenshot=website-visual-qa/home.png "$base"
                  "$chrome" "${common_args[@]}" --window-size=1440,5200 --screenshot=website-visual-qa/full-page.png "$base"
                  "$chrome" "${common_args[@]}" --window-size=1440,5200 --force-prefers-reduced-motion --screenshot=website-visual-qa/full-page-reduced-motion.png "$base"

                  cat > website-visual-qa/README.txt <<EOF
                  Fresnica website visual QA
                  source_sha=${GITHUB_SHA}
                  hero_viewport=1440x1000
                  full_page_viewport=1440x5200
                  reduced_motion=full-page-reduced-motion.png
                  EOF

            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: website-visual-qa
                  path: website-visual-qa
                  if-no-files-found: warn
                  retention-days: 7

    consumer:
        name: React 18.0 consumer
        runs-on: ubuntu-latest
        needs: [quality]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run test:consumer-react18

    build:
        name: Demo build
        runs-on: ubuntu-latest
        needs: [lint, test, quality, consumer]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run build:demo
            - uses: actions/upload-artifact@v7
              with:
                  name: demo-dist
                  path: demo-dist
                  retention-days: 7

    delivery:
        name: Delivery artifact
        runs-on: ubuntu-latest
        needs: [build]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run delivery:record
              env:
                  FRESNICA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
            - uses: actions/upload-artifact@v7
              with:
                  name: fresnica-ui-delivery
                  path: delivery
                  if-no-files-found: error
                  retention-days: 30
