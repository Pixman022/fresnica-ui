name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# 同一 PR 上取消旧的运行
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [20, 22]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - run: npm ci
            - run: npm run format:check
            - run: npm run audit:tokens
            - run: npm run lint

    test:
        name: Test (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [20, 22]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - run: npm ci
            - run: npm run test:run

    quality:
        name: Full quality gate
        runs-on: ubuntu-latest
        needs: [lint, test]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - name: Audit development dependencies (report only)
              continue-on-error: true
              run: npm audit --audit-level=moderate
            - name: Audit production dependencies (gate)
              run: npm audit --omit=dev --audit-level=moderate --workspace __m01_missing_workspace__
            - run: npm run ci
            - run: npm run test:cov
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: coverage
                  path: coverage
                  if-no-files-found: error
                  retention-days: 14

    consumer:
        name: React 18.0 consumer
        runs-on: ubuntu-latest
        needs: [quality]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run test:consumer-react18

    build:
        name: Demo build
        runs-on: ubuntu-latest
        needs: [lint, test, quality, consumer]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run build:demo
            - uses: actions/upload-artifact@v4
              with:
                  name: demo-dist
                  path: demo-dist
                  retention-days: 7

    delivery:
        name: Delivery artifact
        runs-on: ubuntu-latest
        needs: [build]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run delivery:record
              env:
                  FRESNICA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
            - uses: actions/upload-artifact@v4
              with:
                  name: fresnica-ui-delivery
                  path: delivery
                  if-no-files-found: error
                  retention-days: 30
