name: V3 Website Visual QA

on:
  workflow_dispatch:
  push:
    branches:
      - design/website-vision-motion-concept-2026-10-27
    paths:
      - .github/workflows/website-v3-qa.yml
      - public/fresnica-v3-motion-preview/**
      - scripts/audit-website-v3.mjs
      - scripts/check-website-v3-browser.mjs
      - scripts/check-website-v3-motion.mjs
      - scripts/check-website-v3-carousel-idle.mjs
      - scripts/check-website-v3-native-zoom.mjs
      - scripts/v3-native-zoom-keys.py
      - package.json

permissions:
  contents: read

jobs:
  v3-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check V3 static design contract
        run: npm run audit:website-v3
      - name: Prepare isolated browser and preview fonts
        run: |
          # Install browser tooling outside the project to avoid npm's peer graph
          # error when adding an untracked package after npm ci.
          mkdir -p /tmp/v3-playwright
          npm install --prefix /tmp/v3-playwright --no-save --no-package-lock --ignore-scripts playwright@1.55.1
          ln -s /tmp/v3-playwright/node_modules/playwright node_modules/playwright
          ln -s /tmp/v3-playwright/node_modules/playwright-core node_modules/playwright-core
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "No system Chromium/Chrome available on this runner" >&2
            exit 1
          fi
          echo "V3_CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
          mkdir -p public/fresnica-v3-motion-preview/fonts
          for weight in 400 500 600 700; do
            cp "node_modules/@fontsource/roboto/files/roboto-latin-${weight}-normal.woff2" public/fresnica-v3-motion-preview/fonts/
          done
          for weight in 400 500 700; do
            cp "src/assets/fonts/noto-sans-sc-chinese-simplified-${weight}-normal.woff2" public/fresnica-v3-motion-preview/fonts/
          done
      - name: Capture and inspect seven widths and both themes
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public > /tmp/v3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          V3_PREVIEW_URL="http://127.0.0.1:4173/fresnica-v3-motion-preview/" node scripts/check-website-v3-browser.mjs
          V3_PREVIEW_URL="http://127.0.0.1:4173/fresnica-v3-motion-preview/" node scripts/check-website-v3-motion.mjs
          node scripts/check-website-v3-carousel-idle.mjs
          V3_PREVIEW_URL="http://127.0.0.1:4173/fresnica-v3-motion-preview/" xvfb-run -a --server-args='-screen 0 1920x1200x24' node scripts/check-website-v3-native-zoom.mjs
      - name: Upload screenshots and findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresnica-v3-visual-qa
          path: artifacts/website-v3-browser/
          retention-days: 14
          if-no-files-found: warn
