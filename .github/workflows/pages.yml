name: Deploy Demo to GitHub Pages

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    deploy:
        name: GitHub Pages
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'main')
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: Audit production dependencies (manual gate)
              if: github.event_name == 'workflow_dispatch'
              run: npm audit --omit=dev --audit-level=moderate

            - run: npm run build:demo

            # Package the active V3 marketing preview with the updated shared UI
            # demo. The original V2 preview is an unchanged historical route.
            - name: Checkout active V3 preview
              uses: actions/checkout@v7
              with:
                  ref: design/website-vision-motion-concept-2026-10-27
                  path: .v3-preview-source

            - name: Overlay current V3 without modifying frozen V2
              shell: bash
              run: |
                  set -euo pipefail
                  source=.v3-preview-source/public
                  test -s "$source/fresnica-v3-motion-preview/index.html"
                  test -s "$source/fresnica-v3-motion-preview/m58-brand-palette.css"
                  test -s "$source/fresnica-v3-motion-preview/wallet-home.html"
                  test -s "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  test -s "$source/fresnica-v3-motion-preview/Fresnica-logo-actions.svg"
                  grep -Fq 'data-icon-source="Fresnica-logo(1).svg"' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  grep -Fq 'data:image/svg+xml;charset=utf-8,' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  grep -Fq '<span class="phone-network"><span class="phone-network-dot" aria-hidden="true"></span>Stellar Mainnet</span>' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  # The gallery shares one preview menu and uses real links for
                  # Home / Activity / dApps / Settings; Actions stays a bottom sheet.
                  for page in mobile-demo.html mobile-demo-1-1.html wallet-home.html mobile-activity.html mobile-dapps.html mobile-settings.html; do
                      test -s "$source/fresnica-v3-motion-preview/$page"
                      grep -Fq 'mobile-gallery-system.css' "$source/fresnica-v3-motion-preview/$page"
                      grep -Fq 'mobile-gallery-system.js' "$source/fresnica-v3-motion-preview/$page"
                  done
                  test -s "$source/fresnica-v3-motion-preview/mobile-gallery-system.css"
                  test -s "$source/fresnica-v3-motion-preview/mobile-gallery-system.js"
                  node --check "$source/fresnica-v3-motion-preview/mobile-gallery-system.js"
                  grep -Fq 'class="gallery-screen-title">Activity</h1>' "$source/fresnica-v3-motion-preview/mobile-activity.html"
                  grep -Fq 'class="gallery-screen-title">dApps</h1>' "$source/fresnica-v3-motion-preview/mobile-dapps.html"
                  grep -Fq 'class="gallery-screen-title">Settings</h1>' "$source/fresnica-v3-motion-preview/mobile-settings.html"
                  # Keep the gallery concise; protect essential content and the demo-only disclosure.
                  grep -Fq '<span class="phone-label">Total balance</span>' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  ! grep -Fq 'Stellar assets, all in view.' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  ! grep -Fq 'Wallet transactions on Stellar.' "$source/fresnica-v3-motion-preview/mobile-activity.html"
                  ! grep -Fq 'Open a compatible Stellar app and review its request before connecting.' "$source/fresnica-v3-motion-preview/mobile-dapps.html"
                  ! grep -Fq 'View preferences from the gallery menu.' "$source/fresnica-v3-motion-preview/mobile-settings.html"
                  grep -Fq 'Preview only — no live connection.' "$source/fresnica-v3-motion-preview/mobile-dapps.html"
                  grep -Fq '.preview-nav-copy small' "$source/fresnica-v3-motion-preview/mobile-gallery-system.css"
                  # A single responsive menu controls all six sample screens.
                  grep -Fq 'className = "gallery-menu-toggle"' "$source/fresnica-v3-motion-preview/mobile-gallery-system.js"
                  grep -Fq 'className = "gallery-menu-backdrop"' "$source/fresnica-v3-motion-preview/mobile-gallery-system.js"
                  grep -Fq 'html.gallery-menu-open .preview-sidebar' "$source/fresnica-v3-motion-preview/mobile-gallery-system.css"
                  grep -Fq 'html.preview-immersive .gallery-menu-toggle' "$source/fresnica-v3-motion-preview/mobile-gallery-system.css"
                  test -s "$source/fresnica-v3-orb-demo/index.html"
                  mkdir -p demo-dist/fresnica-v3-motion-preview demo-dist/fresnica-v3-orb-demo
                  cp -a "$source/fresnica-v3-motion-preview/." demo-dist/fresnica-v3-motion-preview/
                  cp -a "$source/fresnica-v3-orb-demo/." demo-dist/fresnica-v3-orb-demo/
                  cmp "$source/fresnica-v3-motion-preview/index.html" demo-dist/fresnica-v3-motion-preview/index.html
                  cmp "$source/fresnica-v3-motion-preview/m58-brand-palette.css" demo-dist/fresnica-v3-motion-preview/m58-brand-palette.css
                  cmp "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html" demo-dist/fresnica-v3-motion-preview/mobile-demo-1-1.html
                  for file in mobile-activity.html mobile-dapps.html mobile-settings.html mobile-gallery-system.css mobile-gallery-system.js; do
                      cmp "$source/fresnica-v3-motion-preview/$file" "demo-dist/fresnica-v3-motion-preview/$file"
                  done
                  cmp "$source/fresnica-v3-motion-preview/Fresnica-logo-actions.svg" demo-dist/fresnica-v3-motion-preview/Fresnica-logo-actions.svg
                  cmp public/fresnica-website-preview/index.html demo-dist/fresnica-website-preview/index.html

            - name: Verify mobile gallery navigation in Chromium
              shell: bash
              run: |
                  set -euo pipefail
                  python3 -m http.server 4178 --bind 127.0.0.1 --directory demo-dist >/tmp/gallery-preview.log 2>&1 &
                  server_pid=$!
                  trap 'kill "$server_pid" 2>/dev/null || true' EXIT
                  chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
                  test -n "$chrome"
                  for page in mobile-demo-1-1.html mobile-activity.html mobile-dapps.html mobile-settings.html; do
                      url="http://127.0.0.1:4178/fresnica-v3-motion-preview/$page"
                      "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=1800 --dump-dom "$url" 2>/tmp/gallery-chrome.log >"/tmp/gallery-$page"
                      grep -Fq 'class="gallery-preferences"' "/tmp/gallery-$page"
                      grep -Fq 'href="./mobile-activity.html"' "/tmp/gallery-$page"
                      grep -Fq 'href="./mobile-dapps.html"' "/tmp/gallery-$page"
                      grep -Fq 'href="./mobile-settings.html"' "/tmp/gallery-$page"
                      grep -Fq 'class="gallery-menu-toggle"' "/tmp/gallery-$page"
                      grep -Fq 'aria-controls="gallery-screen-menu"' "/tmp/gallery-$page"
                      grep -Fq 'class="gallery-menu-backdrop"' "/tmp/gallery-$page"
                  done

            - name: Configure Pages
              uses: actions/configure-pages@v6

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: demo-dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
