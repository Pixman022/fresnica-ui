name: Deploy Demo to GitHub Pages

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    deploy:
        name: GitHub Pages
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'main')
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: Audit production dependencies (manual gate)
              if: github.event_name == 'workflow_dispatch'
              run: npm audit --omit=dev --audit-level=moderate

            - run: npm run build:demo

            # Package the active V3 marketing preview with the updated shared UI
            # demo. The original V2 preview is an unchanged historical route.
            - name: Checkout active V3 preview
              uses: actions/checkout@v7
              with:
                  ref: design/website-vision-motion-concept-2026-10-27
                  path: .v3-preview-source

            - name: Overlay current V3 without modifying frozen V2
              shell: bash
              run: |
                  set -euo pipefail
                  source=.v3-preview-source/public
                  test -s "$source/fresnica-v3-motion-preview/index.html"
                  test -s "$source/fresnica-v3-motion-preview/m58-brand-palette.css"
                  test -s "$source/fresnica-v3-motion-preview/wallet-home.html"
                  test -s "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  test -s "$source/fresnica-v3-motion-preview/Fresnica-logo-actions.svg"
                  grep -Fq 'data-icon-source="Fresnica-logo(1).svg"' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  grep -Fq 'data:image/svg+xml;charset=utf-8,' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  grep -Fq '<span class="phone-network"><span class="phone-network-dot" aria-hidden="true"></span>Stellar Mainnet</span>' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  # The gallery shares one preview menu and uses real links for
                  # Home / Activity / dApps / Settings; Actions stays a bottom sheet.
                  for page in mobile-demo.html mobile-demo-1-1.html wallet-home.html mobile-activity.html mobile-dapps.html mobile-settings.html; do
                      test -s "$source/fresnica-v3-motion-preview/$page"
                      grep -Fq 'mobile-gallery-system.css' "$source/fresnica-v3-motion-preview/$page"
                      grep -Fq 'mobile-gallery-system.js' "$source/fresnica-v3-motion-preview/$page"
                  done
                  test -s "$source/fresnica-v3-motion-preview/mobile-gallery-system.css"
                  test -s "$source/fresnica-v3-motion-preview/mobile-gallery-system.js"
                  test -s "$source/fresnica-v3-motion-preview/mobile-wallet-switch.js"
                  node --check "$source/fresnica-v3-motion-preview/mobile-gallery-system.js"
                  node --check "$source/fresnica-v3-motion-preview/mobile-wallet-switch.js"
                  grep -Fq 'class="gallery-screen-title">Activity</h1>' "$source/fresnica-v3-motion-preview/mobile-activity.html"
                  grep -Fq 'class="gallery-screen-title">dApps</h1>' "$source/fresnica-v3-motion-preview/mobile-dapps.html"
                  grep -Fq 'class="gallery-screen-title">Settings</h1>' "$source/fresnica-v3-motion-preview/mobile-settings.html"
                  # Activity, dApps and Settings have one title in the top-left header.
                  grep -Fq '<div class="phone-header"><h1 class="gallery-screen-title">Activity</h1></div>' "$source/fresnica-v3-motion-preview/mobile-activity.html"
                  grep -Fq '<div class="phone-header"><h1 class="gallery-screen-title">dApps</h1><button' "$source/fresnica-v3-motion-preview/mobile-dapps.html"
                  grep -Fq '<div class="phone-header"><h1 class="gallery-screen-title">Settings</h1></div>' "$source/fresnica-v3-motion-preview/mobile-settings.html"
                  for page in mobile-activity.html mobile-dapps.html mobile-settings.html; do
                      ! grep -Fq '<span class="phone-brand">Fresnica</span>' "$source/fresnica-v3-motion-preview/$page"
                      test "$(grep -o 'class="gallery-screen-title"' "$source/fresnica-v3-motion-preview/$page" | wc -l)" -eq 1
                  done
                  # Keep the gallery concise; protect essential content and the demo-only disclosure.
                  grep -Fq '<span class="phone-label">Total balance</span>' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  ! grep -Fq 'Stellar assets, all in view.' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  ! grep -Fq 'Wallet transactions on Stellar.' "$source/fresnica-v3-motion-preview/mobile-activity.html"
                  ! grep -Fq 'Open a compatible Stellar app and review its request before connecting.' "$source/fresnica-v3-motion-preview/mobile-dapps.html"
                  ! grep -Fq 'View preferences from the gallery menu.' "$source/fresnica-v3-motion-preview/mobile-settings.html"
                  grep -Fq 'Preview only — no live connection.' "$source/fresnica-v3-motion-preview/mobile-dapps.html"
                  grep -Fq '.preview-nav-copy small' "$source/fresnica-v3-motion-preview/mobile-gallery-system.css"
                  # A single responsive menu controls all six sample screens.
                  grep -Fq 'className = "gallery-menu-toggle"' "$source/fresnica-v3-motion-preview/mobile-gallery-system.js"
                  grep -Fq 'className = "gallery-menu-backdrop"' "$source/fresnica-v3-motion-preview/mobile-gallery-system.js"
                  grep -Fq 'html.gallery-menu-open .preview-sidebar' "$source/fresnica-v3-motion-preview/mobile-gallery-system.css"
                  grep -Fq 'visibility 0s linear 0s' "$source/fresnica-v3-motion-preview/mobile-gallery-system.css"
                  grep -Fq 'html.preview-immersive .gallery-menu-toggle' "$source/fresnica-v3-motion-preview/mobile-gallery-system.css"
                  # Main pages use a wallet identity in Home; reference previews remain grouped separately.
                  grep -Fq 'data-gallery-en="Main pages" data-gallery-zh="主要页面"' "$source/fresnica-v3-motion-preview/mobile-gallery-system.js"
                  grep -Fq 'data-gallery-en="Reference pages" data-gallery-zh="参考页面"' "$source/fresnica-v3-motion-preview/mobile-gallery-system.js"
                  grep -Fq '.gallery-nav-group-label.is-reference' "$source/fresnica-v3-motion-preview/mobile-gallery-system.css"
                  ! grep -Fq 'class="brand-icon"' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  grep -Fq 'class="home11-wallet-summary"' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  grep -Fq 'class="home11-wallet-name">SuperWallet' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  grep -Fq 'class="home11-wallet-address">GB3U' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  grep -Fq 'class="home11-wallet-switch"' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  grep -Fq 'src="./mobile-wallet-switch.js"' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  grep -Fq 'class="home11-wallet-backdrop"' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  grep -Fq 'class="home11-wallet-create-entry"' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  grep -Fq 'class="home11-wallet-create-view" hidden' "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html"
                  for page in mobile-activity.html mobile-dapps.html mobile-settings.html; do
                      ! grep -Fq 'class="brand-icon"' "$source/fresnica-v3-motion-preview/$page"
                  done
                  grep -Fq 'Recently used dApps' "$source/fresnica-v3-motion-preview/mobile-gallery-system.js"
                  grep -Fq 'Official shortcuts' "$source/fresnica-v3-motion-preview/mobile-gallery-system.js"
                  grep -Fq 'data-gallery-website-input' "$source/fresnica-v3-motion-preview/mobile-dapps.html"
                  test -s "$source/fresnica-v3-orb-demo/index.html"
                  mkdir -p demo-dist/fresnica-v3-motion-preview demo-dist/fresnica-v3-orb-demo
                  cp -a "$source/fresnica-v3-motion-preview/." demo-dist/fresnica-v3-motion-preview/
                  cp -a "$source/fresnica-v3-orb-demo/." demo-dist/fresnica-v3-orb-demo/
                  cmp "$source/fresnica-v3-motion-preview/index.html" demo-dist/fresnica-v3-motion-preview/index.html
                  cmp "$source/fresnica-v3-motion-preview/m58-brand-palette.css" demo-dist/fresnica-v3-motion-preview/m58-brand-palette.css
                  cmp "$source/fresnica-v3-motion-preview/mobile-demo-1-1.html" demo-dist/fresnica-v3-motion-preview/mobile-demo-1-1.html
                  for file in mobile-activity.html mobile-dapps.html mobile-settings.html mobile-gallery-system.css mobile-gallery-system.js mobile-wallet-switch.js; do
                      cmp "$source/fresnica-v3-motion-preview/$file" "demo-dist/fresnica-v3-motion-preview/$file"
                  done
                  cmp "$source/fresnica-v3-motion-preview/Fresnica-logo-actions.svg" demo-dist/fresnica-v3-motion-preview/Fresnica-logo-actions.svg
                  cmp public/fresnica-website-preview/index.html demo-dist/fresnica-website-preview/index.html

            - name: Verify mobile gallery navigation in Chromium
              shell: bash
              run: |
                  set -euo pipefail
                  python3 -m http.server 4178 --bind 127.0.0.1 --directory demo-dist >/tmp/gallery-preview.log 2>&1 &
                  server_pid=$!
                  trap 'kill "$server_pid" 2>/dev/null || true' EXIT
                  chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
                  test -n "$chrome"
                  for page in mobile-demo.html mobile-demo-1-1.html wallet-home.html mobile-activity.html mobile-dapps.html mobile-settings.html; do
                      url="http://127.0.0.1:4178/fresnica-v3-motion-preview/$page"
                      "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=1800 --dump-dom "$url" 2>/tmp/gallery-chrome.log >"/tmp/gallery-$page"
                      grep -Fq 'class="gallery-preferences"' "/tmp/gallery-$page"
                      grep -Fq 'href="./mobile-activity.html"' "/tmp/gallery-$page"
                      grep -Fq 'href="./mobile-dapps.html"' "/tmp/gallery-$page"
                      grep -Fq 'href="./mobile-settings.html"' "/tmp/gallery-$page"
                      grep -Fq 'class="gallery-menu-toggle"' "/tmp/gallery-$page"
                      grep -Fq 'aria-controls="gallery-screen-menu"' "/tmp/gallery-$page"
                      grep -Fq 'class="gallery-menu-backdrop"' "/tmp/gallery-$page"
                      grep -Fq 'class="gallery-nav-group-label"' "/tmp/gallery-$page"
                      grep -Fq 'class="gallery-nav-group-label is-reference"' "/tmp/gallery-$page"
                  done
                  # Exercise the actual drawer in a 390px iframe and verify the desktop menu.
                  cat > demo-dist/gallery-drawer-smoke.html <<'HTML'
                  <!doctype html><html lang="en"><head><meta charset="utf-8"></head><body>
                  <div id="result">PENDING</div>
                  <iframe id="phone" title="phone preview" src="./fresnica-v3-motion-preview/mobile-demo-1-1.html" style="width:390px;height:740px"></iframe>
                  <iframe id="desktop" title="desktop preview" src="./fresnica-v3-motion-preview/mobile-demo-1-1.html" style="width:1100px;height:740px"></iframe>
                  <script>
                  window.addEventListener('load', () => {
                    const output = document.getElementById('result');
                    try {
                      const mobile = document.getElementById('phone').contentDocument;
                      const desktop = document.getElementById('desktop').contentDocument;
                      const toggle = mobile.querySelector('.gallery-menu-toggle');
                      const aside = mobile.querySelector('#gallery-screen-menu');
                      const backdrop = mobile.querySelector('.gallery-menu-backdrop');
                      const root = mobile.documentElement;
                      const style = (element) => mobile.defaultView.getComputedStyle(element);
                      if (!toggle || !aside || !backdrop) throw Error('missing drawer elements');
                      if (!mobile.defaultView.matchMedia('(max-width: 760px)').matches) throw Error('mobile viewport mismatch');
                      if (style(toggle).display === 'none' || style(aside).visibility !== 'hidden') throw Error('mobile menu not collapsed');
                      if (aside.querySelectorAll('.gallery-switch').length !== 4) throw Error('gallery preferences missing');
                      toggle.click();
                      if (!root.classList.contains('gallery-menu-open') || toggle.getAttribute('aria-expanded') !== 'true') throw Error('cannot open drawer');
                      if (style(aside).visibility !== 'visible' || backdrop.hidden) throw Error('drawer not visible');
                      mobile.dispatchEvent(new mobile.defaultView.KeyboardEvent('keydown', {key: 'Escape', bubbles: true, cancelable: true}));
                      if (root.classList.contains('gallery-menu-open')) throw Error('Escape did not close drawer');
                      toggle.click();
                      backdrop.click();
                      if (root.classList.contains('gallery-menu-open') || toggle.getAttribute('aria-expanded') !== 'false') throw Error('backdrop did not close drawer');
                      root.classList.add('preview-immersive');
                      if (style(toggle).display !== 'none') throw Error('fullscreen control overlap');
                      root.classList.remove('preview-immersive');
                      const desktopToggle = desktop.querySelector('.gallery-menu-toggle');
                      if (!desktopToggle || desktop.defaultView.getComputedStyle(desktopToggle).display !== 'none') throw Error('desktop toggle visible');
                      if (desktop.defaultView.getComputedStyle(desktop.querySelector('.preview-sidebar')).visibility !== 'visible') throw Error('desktop menu hidden');
                      const walletToggle = mobile.querySelector('.home11-wallet-switch');
                      const walletPopup = mobile.querySelector('#home11-wallet-selector');
                      if (!walletToggle || !walletPopup || !walletPopup.hidden) throw Error('wallet switch missing');
                      walletToggle.click();
                      if (walletPopup.hidden || walletToggle.getAttribute('aria-expanded') !== 'true') throw Error('wallet switch cannot open');
                      const walletPhone = mobile.querySelector('.home11-phone');
                      const walletRect = walletPhone.getBoundingClientRect();
                      const toggleRect = walletToggle.getBoundingClientRect();
                      if (toggleRect.right - walletRect.left > walletRect.width * 0.618 + 1) throw Error('wallet switch crosses golden-ratio boundary');
                      if (style(mobile.querySelector('.home11-wallet-avatar')).backgroundColor !== 'rgb(32, 48, 41)') throw Error('wallet avatar background not dark');
                      if (!walletPopup.querySelector('.home11-wallet-backdrop') || !walletPopup.querySelector('.home11-wallet-sheet')) throw Error('wallet bottom sheet absent');
                      const popupRect = walletPopup.getBoundingClientRect();
                      if (Math.abs(popupRect.bottom - walletRect.bottom) > 2) throw Error('wallet overlay not phone-aligned');
                      walletPopup.querySelector('[data-wallet-index="1"]').click();
                      if (mobile.querySelector('.home11-wallet-name').textContent !== 'Wallet 2' || !walletPopup.hidden) throw Error('wallet selection failed');
                      walletToggle.click();
                      walletPopup.querySelector('.home11-wallet-create-entry').click();
                      const createView = walletPopup.querySelector('.home11-wallet-create-view');
                      if (createView.hidden) throw Error('wallet create entry did not open');
                      createView.querySelector('input').value = 'Test Wallet';
                      createView.querySelector('.home11-wallet-create-submit').click();
                      if (mobile.querySelector('.home11-wallet-name').textContent !== 'Test Wallet' || !walletPopup.hidden) throw Error('demo wallet create flow failed');
                      output.textContent = 'GALLERY_DRAWER_PASS';
                    } catch (error) {
                      output.textContent = 'GALLERY_DRAWER_FAIL: ' + error.message;
                    }
                  });
                  </script></body></html>
                  HTML
                  "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=460,850 --virtual-time-budget=7000 --dump-dom "http://127.0.0.1:4178/gallery-drawer-smoke.html" 2>/tmp/gallery-drawer-chrome.log >/tmp/gallery-drawer-result.html
                  if ! grep -Fq '<div id="result">GALLERY_DRAWER_PASS</div>' /tmp/gallery-drawer-result.html; then
                      grep -oE '<div id="result">[^<]*</div>' /tmp/gallery-drawer-result.html | tail -n 1 || true
                      tail -n 15 /tmp/gallery-drawer-chrome.log || true
                      exit 1
                  fi
                  echo "Mobile gallery drawer interaction smoke: PASS"
                  rm demo-dist/gallery-drawer-smoke.html

            - name: Configure Pages
              uses: actions/configure-pages@v6

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: demo-dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
