name: Deploy Demo to GitHub Pages

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
    workflow_dispatch:
    # V3 branch only. The default-branch workflow is deliberately unchanged.
    push:
        branches:
            - design/website-vision-motion-concept-2026-10-27
        paths:
            - .github/workflows/pages.yml
            - public/fresnica-v3-motion-preview/**
            - public/fresnica-v3-orb-demo/**

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    deploy:
        name: GitHub Pages (preserve frozen V2)
        if: >-
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'main')
        runs-on: ubuntu-latest
        # Separate environment avoids the default github-pages branch restriction.
        environment:
            name: v3-preview
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            # An explicit frozen commit is used whenever V3 is published, so
            # every original Pages route continues to contain the V2 baseline.
            - name: Checkout frozen V2 site
              uses: actions/checkout@v7
              with:
                  ref: f3e68515d90fe05a12a640db153f1b14004cad32

            # Read the new preview from the exact triggering commit. This checkout
            # is isolated from the frozen build and cannot change V2 source.
            - name: Checkout V3 preview overlay
              if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  path: .v3-preview-source

            - name: Verify V3 release branch and preview files
              if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
              shell: bash
              run: |
                  set -euo pipefail
                  test "${GITHUB_REF_NAME}" = 'design/website-vision-motion-concept-2026-10-27'
                  test -s .v3-preview-source/public/fresnica-v3-motion-preview/index.html
                  test -s .v3-preview-source/public/fresnica-v3-motion-preview/m5-story.js
                  test -s .v3-preview-source/public/fresnica-v3-motion-preview/m6-states.js
                  test -s .v3-preview-source/public/fresnica-v3-motion-preview/m7-polish.js
                  test -s .v3-preview-source/public/fresnica-v3-motion-preview/m10-frame.js
                  test -s .v3-preview-source/public/fresnica-v3-motion-preview/m12-experience.js
                  test -s .v3-preview-source/public/fresnica-v3-motion-preview/m13-revisions.js
                  test -s .v3-preview-source/public/fresnica-v3-motion-preview/m13-styles.css
                  grep -Fq 'src="./m13-revisions.js"' .v3-preview-source/public/fresnica-v3-motion-preview/index.html
                  grep -Fq 'href="./m13-styles.css"' .v3-preview-source/public/fresnica-v3-motion-preview/index.html
                  grep -Fq 'src="./m12-experience.js"' .v3-preview-source/public/fresnica-v3-motion-preview/index.html
                  grep -Fq 'src="./m10-frame.js"' .v3-preview-source/public/fresnica-v3-motion-preview/index.html
                  grep -Fq 'src="./m7-polish.js"' .v3-preview-source/public/fresnica-v3-motion-preview/index.html
                  grep -Fq 'src="./m6-states.js"' .v3-preview-source/public/fresnica-v3-motion-preview/index.html
                  grep -Fq 'src="./m5-story.js"' .v3-preview-source/public/fresnica-v3-motion-preview/index.html
                  test -s .v3-preview-source/public/fresnica-v3-orb-demo/index.html
                  test -s public/fresnica-website-preview/index.html
                  echo "Frozen V2 source: $(git rev-parse HEAD)"
                  echo "V3 overlay source: $(git -C .v3-preview-source rev-parse HEAD)"
                  test "$(git -C .v3-preview-source rev-parse HEAD)" = "${GITHUB_SHA}"

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: Audit production dependencies (manual/V3 gate)
              if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
              run: npm audit --omit=dev --audit-level=moderate

            - run: npm run build:demo

            - name: Overlay V3 without touching any legacy route
              if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
              shell: bash
              run: |
                  set -euo pipefail
                  # Vite must have copied the entire frozen public directory.
                  test -s demo-dist/fresnica-website-preview/index.html
                  cmp public/fresnica-website-preview/index.html demo-dist/fresnica-website-preview/index.html
                  # Guard against accidentally replacing a path that existed in V2.
                  test ! -e demo-dist/fresnica-v3-motion-preview
                  test ! -e demo-dist/fresnica-v3-orb-demo
                  mkdir -p demo-dist/fresnica-v3-motion-preview demo-dist/fresnica-v3-orb-demo
                  cp .v3-preview-source/public/fresnica-v3-motion-preview/index.html demo-dist/fresnica-v3-motion-preview/index.html
                  cp .v3-preview-source/public/fresnica-v3-motion-preview/m5-story.js demo-dist/fresnica-v3-motion-preview/m5-story.js
                  cp .v3-preview-source/public/fresnica-v3-motion-preview/m6-states.js demo-dist/fresnica-v3-motion-preview/m6-states.js
                  cp .v3-preview-source/public/fresnica-v3-motion-preview/m7-polish.js demo-dist/fresnica-v3-motion-preview/m7-polish.js
                  cp .v3-preview-source/public/fresnica-v3-motion-preview/m10-frame.js demo-dist/fresnica-v3-motion-preview/m10-frame.js
                  cp .v3-preview-source/public/fresnica-v3-motion-preview/m12-experience.js demo-dist/fresnica-v3-motion-preview/m12-experience.js
                  cp .v3-preview-source/public/fresnica-v3-motion-preview/m13-revisions.js demo-dist/fresnica-v3-motion-preview/m13-revisions.js
                  cp .v3-preview-source/public/fresnica-v3-motion-preview/m13-styles.css demo-dist/fresnica-v3-motion-preview/m13-styles.css
                  cp .v3-preview-source/public/fresnica-v3-orb-demo/index.html demo-dist/fresnica-v3-orb-demo/index.html
                  cmp .v3-preview-source/public/fresnica-v3-motion-preview/index.html demo-dist/fresnica-v3-motion-preview/index.html
                  cmp .v3-preview-source/public/fresnica-v3-motion-preview/m5-story.js demo-dist/fresnica-v3-motion-preview/m5-story.js
                  cmp .v3-preview-source/public/fresnica-v3-motion-preview/m6-states.js demo-dist/fresnica-v3-motion-preview/m6-states.js
                  cmp .v3-preview-source/public/fresnica-v3-motion-preview/m7-polish.js demo-dist/fresnica-v3-motion-preview/m7-polish.js
                  cmp .v3-preview-source/public/fresnica-v3-motion-preview/m10-frame.js demo-dist/fresnica-v3-motion-preview/m10-frame.js
                  cmp .v3-preview-source/public/fresnica-v3-motion-preview/m12-experience.js demo-dist/fresnica-v3-motion-preview/m12-experience.js
                  cmp .v3-preview-source/public/fresnica-v3-motion-preview/m13-revisions.js demo-dist/fresnica-v3-motion-preview/m13-revisions.js
                  cmp .v3-preview-source/public/fresnica-v3-motion-preview/m13-styles.css demo-dist/fresnica-v3-motion-preview/m13-styles.css
                  cmp .v3-preview-source/public/fresnica-v3-orb-demo/index.html demo-dist/fresnica-v3-orb-demo/index.html
                  # Recheck the legacy route immediately before uploading Pages.
                  cmp public/fresnica-website-preview/index.html demo-dist/fresnica-website-preview/index.html
                  echo "V2 unchanged (SHA-256): $(sha256sum demo-dist/fresnica-website-preview/index.html)"
                  echo 'V3 published at /fresnica-v3-motion-preview/ and /fresnica-v3-orb-demo/'

            - name: Configure Pages
              uses: actions/configure-pages@v6

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: demo-dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5