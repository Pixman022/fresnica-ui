perience designed to keep recipients, assets, and important details easy to review.":"\u4ee5\u76f4\u89c2\u65b9\u5f0f\u4e86\u89e3 Stellar \u8d44\u4ea7\u6536\u53d1\uff0c\u6536\u6b3e\u65b9\u3001\u8d44\u4ea7\u53ca\u91cd\u8981\u4ea4\u6613\u4fe1\u606f\u6e05\u695a\u53ef\u89c1\u3002","Swaps, made easier to understand.":"\u4ee3\u5e01\u5151\u6362\uff0c\u66f4\u6613\u7406\u89e3\u3002","Explore swaps between supported Stellar assets, with a clear view of the estimated exchange and the details to review before confirming in the app.":"\u76f4\u89c2\u4e86\u89e3\u652f\u6301\u7684 Stellar \u8d44\u4ea7\u95f4\u7684\u5151\u6362\uff0c\u5728 App \u5185\u786e\u8ba4\u524d\u6e05\u695a\u67e5\u770b\u9884\u4f30\u7ed3\u679c\u548c\u76f8\u5173\u4ea4\u6613\u4fe1\u606f\u3002","Closer to the Stellar ecosystem.":"\u63a2\u7d22 Stellar \u751f\u6001\uff0c\u8fde\u63a5\u66f4\u591a\u53ef\u80fd\u3002","Discover compatible Stellar apps and see connection requests through a wallet experience built around clarity.":"\u53d1\u73b0\u517c\u5bb9\u7684 Stellar \u751f\u6001\u5e94\u7528\uff0c\u5e76\u901a\u8fc7\u6e05\u6670\u7684\u8fde\u63a5\u8bf7\u6c42\u754c\u9762\u4e86\u89e3\u5e94\u7528\u4e0e\u94b1\u5305\u7684\u4ea4\u4e92\u3002","FOCUSED ON STELLAR":"\u4e13\u6ce8 STELLAR","Built around one ecosystem.":"\u4e13\u6ce8\u4e00\u4e2a\u751f\u6001\uff0c\u4f53\u9a8c\u66f4\u52a0\u7eaf\u7cb9\u3002","Fresnica focuses on Stellar, bringing everyday wallet essentials together without the distraction of navigating multiple blockchain networks.":"Fresnica \u4e13\u6ce8 Stellar \u7f51\u7edc\uff0c\u5c06\u65e5\u5e38\u94b1\u5305\u6240\u9700\u6574\u5408\u5728\u4e00\u8d77\uff0c\u65e0\u9700\u5728\u591a\u4e2a\u533a\u5757\u94fe\u7f51\u7edc\u4e4b\u95f4\u6765\u56de\u5207\u6362\u3002","Learn About Fresnica":"\u4e86\u89e3 Fresnica","SECURITY & CONTROL":"\u5b89\u5168\u4e0e\u638c\u63a7","Know before you confirm.":"\u786e\u8ba4\u4e4b\u524d\uff0c\u6e05\u695a\u4e86\u89e3\u3002","Important wallet actions deserve a clear review. Fresnica is designed to present the details of payments and app connections in a way that's easier to understand.":"\u91cd\u8981\u7684\u94b1\u5305\u64cd\u4f5c\u503c\u5f97\u8ba4\u771f\u6838\u5bf9\u3002Fresnica \u81f4\u529b\u4e8e\u66f4\u6e05\u6670\u5730\u5448\u73b0\u652f\u4ed8\u548c\u5e94\u7528\u8fde\u63a5\u7684\u5173\u952e\u4fe1\u606f\uff0c\u5e2e\u52a9\u7528\u6237\u5728\u786e\u8ba4\u524d\u5145\u5206\u4e86\u89e3\u64cd\u4f5c\u5185\u5bb9\u3002","Review transaction details \u00b7 Understand app requests \u00b7 Stay in control":"\u67e5\u770b\u4ea4\u6613\u4fe1\u606f \u00b7 \u7406\u89e3\u8fde\u63a5\u8bf7\u6c42 \u00b7 \u81ea\u4e3b\u4f5c\u51fa\u786e\u8ba4","Explore Safety Guidance":"\u67e5\u770b\u5b89\u5168\u4f7f\u7528\u6307\u5357","GET FRESNICA":"\u4e0b\u8f7d FRESNICA","Your Stellar experience, wherever you go.":"Stellar \u94b1\u5305\u4f53\u9a8c\uff0c\u968f\u8eab\u76f8\u4f34\u3002","Fresnica is planned for iOS and Android. Check availability for your device and find verified download options when they become available.":"Fresnica \u8ba1\u5212\u652f\u6301 iOS \u4e0e Android\u3002\u67e5\u770b\u8bbe\u5907\u5e73\u53f0\u7684\u5f00\u653e\u72b6\u6001\uff0c\u5e76\u5728\u5b98\u65b9\u6e20\u9053\u5c31\u7eea\u540e\u83b7\u53d6\u7ecf\u8fc7\u6838\u5b9e\u7684\u4e0b\u8f7d\u5165\u53e3\u3002","Check Availability":"\u67e5\u770b\u4e0b\u8f7d\u72b6\u6001","Find the official Fresnica download option for your device.":"\u67e5\u770b\u9002\u7528\u4e8e\u4f60\u7684\u8bbe\u5907\u7684 Fresnica \u5b98\u65b9\u4e0b\u8f7d\u65b9\u5f0f\u3002","GET TO KNOW FRESNICA":"\u4e86\u89e3 FRESNICA","A wallet with a clear focus.":"\u4e00\u4e2a\u66f4\u4e13\u6ce8\u7684\u94b1\u5305\u613f\u666f\u3002","Built for people exploring and using Stellar, Fresnica is designed to make essential wallet experiences easier to find and understand.":"Fresnica \u9762\u5411\u6b63\u5728\u4e86\u89e3\u548c\u4f7f\u7528 Stellar \u7684\u4eba\u4eec\uff0c\u5e0c\u671b\u8ba9\u91cd\u8981\u7684\u94b1\u5305\u529f\u80fd\u66f4\u5bb9\u6613\u53d1\u73b0\u3001\u66f4\u5bb9\u6613\u7406\u89 let motionObserver=null;
let heroParallaxCleanup=null;
function clearHeroParallax(){
 heroParallaxCleanup?.();
 heroParallaxCleanup=null;
}
function initHeroParallax(){
 clearHeroParallax();
 const art=document.querySelector('.geo-v2-hero-art');
 if(!art||!window.matchMedia('(pointer:fine) and (hover:hover)').matches)return;
 let frame=0;
 let nx=0;
 let ny=0;
 const props=['--hero-parallax-x','--hero-parallax-y','--hero-parallax-bg-x','--hero-parallax-bg-y','--hero-parallax-far-x','--hero-parallax-far-y','--hero-parallax-detail-x','--hero-parallax-detail-y'];
 const apply=()=>{
  frame=0;
  art.style.setProperty('--hero-parallax-x',(nx*4).toFixed(2)+'px');
  art.style.setProperty('--hero-parallax-y',(ny*3).toFixed(2)+'px');
  art.style.setProperty('--hero-parallax-bg-x',(nx*-2).toFixed(2)+'px');
  art.style.setProperty('--hero-parallax-bg-y',(ny*-1.5).toFixed(2)+'px');
  art.style.setProperty('--hero-parallax-far-x',(nx*-5).toFixed(2)+'px');
  art.style.setProperty('--hero-parallax-far-y',(ny*-3).toFixed(2)+'px');
  art.style.setProperty('--hero-parallax-detail-x',(nx*3).toFixed(2)+'px');
  art.style.setProperty('--hero-parallax-detail-y',(ny*2).toFixed(2)+'px');
 };
 const queue=()=>{if(!frame)frame=requestAnimationFrame(apply);};
 const onMove=e=>{
  const rect=art.getBoundingClientRect();
  const halfW=Math.max(rect.width/2,1);
  const halfH=Math.max(rect.height/2,1);
  nx=Math.max(-1,Math.min(1,(e.clientX-(rect.left+halfW))/halfW));
  ny=Math.max(-1,Math.min(1,(e.clientY-(rect.top+halfH))/halfH));
  queue();
 };
 const reset=()=>{nx=0;ny=0;queue();};
 art.addEventListener('pointermove',onMove,{passive:true});
 art.addEventListener('pointerleave',reset);
 heroParallaxCleanup=()=>{
  art.removeEventListener('pointermove',onMove);
  art.removeEventListener('pointerleave',reset);
  if(frame)cancelAnimationFrame(frame);
  props.forEach(prop=>art.style.removeProperty(prop));
 };
}
function initMotion(){
 motionObserver?.disconnect();motionObserver=null;
 clearHeroParallax();
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const enabled=window.innerWidth>1100&&!reduced;
 document.documentElement.classList.toggle('motion-enabled',enabled);
 if(!enabled)return;
 const targets=[...document.querySelectorAll('.geo-v2-hero > :first-child,.geo-v2-hero-art,.geo-v2-feature-head,.geo-v2-card,.geo-v2-security > :first-child,.security-geometry')];
 const ambientTargets=new Set([...document.querySelectorAll('.geo-v2-hero-art,.security-geometry')]);
 let cardIndex=0;
 for(const el of targets){
  let delay=0;
  if(el.classList.contains('geo-v2-card'))delay=cardIndex++*70;
  else if(ambientTargets.has(el))delay=100;
  el.classList.add('motion-reveal');
  el.style.setProperty('--motion-delay',delay+'ms');
 }
 if(!('IntersectionObserver' in window)){
  targets.forEach(el=>el.classList.add('is-revealed'));
  ambientTargets.forEach(el=>el.classList.add('is-motion-active'));
  initHeroParallax();
  return;
 }
 const observer=new IntersectionObserver(entries=>{for(const entry of entries){
  const ambient=ambientTargets.has(entry.target);
  if(entry.isIntersecting){
   entry.target.classList.add('is-revealed');
   if(ambient)entry.target.classList.add('is-motion-active');
   else observer.unobserve(entry.target);
  }else if(ambient){
   entry.target.classList.remove('is-motion-active');
  }
 }}, {threshold:.18,rootMargin:'0px 0px -8% 0px'});
 motionObserver=observer;
 targets.forEach(el=>observer.observe(el));
 initHeroParallax();
}

function syncHash(initial=false){const p=parseHash();const hasLocaleChange=p.lang!==state.lang;if(hasLocaleChange)state.lang=p.lang;state.section=p.section;if(p.safety)state.faqCat='security';if(hasLocaleChange||state.menuOpen||p.safety){state.menuOpen=false;if(hasLocaleChange)renderLanguageChange();else render();}else{document.querySelectorAll('.desktop-nav a[data-route]').forEach(a=>{a.classList.toggle('active',a.dataset.route===state.section);if(a.dataset.route===state.section)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});}requestAnimationFrame(()=>{if(initial&&location.hash==='')return;sectionFocus(p.section,initial);if(p.safety)document.querySelector('[data-cat="security"]')?.focus({preventScroll:true});if(hasLocaleChange)focusLanguageControl();});}
function go(section,lang=state.lang){const hash=routeHash(section,lang);if(location.hash!==hash)location.hash=hash;else syncHash(false);}
function rerenderPreserveFocus(selector){const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'});document.querySelector(selector)?.focus({preventScroll:true});}
document.addEventListener('click',e=>{
 const skip=e.target.closest('a[data-act="skip"]');if(skip){e.preventDefault();const main=document.getElementById('main');main?.focus({preventScroll:true});main?.scrollIntoView({block:'start',behavior:'instant'});return;}
 const nav=e.target.closest('a[data-route]');if(nav){e.preventDefault();if(nav.dataset.safety==='true')go('help/security');else go(nav.dataset.route);return;}
 const control=e.target.closest('button[data-act]');if(control){if(control.dataset.act==='language'){const c=state.section;restoreLanguageFocus=true;go(c,state.lang==='en'?'zh':'en');}else if(control.dataset.act==='menu'){state.menuOpen=!state.menuOpen;render();requestAnimationFrame(()=>document.querySelector(state.menuOpen?'.mobile-menu a':'[data-act="menu"]')?.focus({preventScroll:true}));}return;}
 const category=e.target.closest('[data-cat]');if(category){state.faqCat=category.dataset.cat;rerenderPreserveFocus(`[data-cat="${state.faqCat}"]`);return;}
 const faq=e.target.closest('[data-faq]');if(faq){const id=Number(faq.dataset.faq);const opening=!state.faqOpen.has(id);if(opening)state.faqOpen.add(id);else state.faqOpen.delete(id);faq.setAttribute('aria-expanded',String(opening));const answer=document.getElementById(`faq-answer-${id}`);answer?.classList.toggle('open',opening);answer?.setAttribute('aria-hidden',String(!opening));const plus=faq.querySelector('.faq-plus');if(plus)plus.textContent=opening?'−':'+';return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.menuOpen){state.menuOpen=false;rerenderPreserveFocus('[data-act="menu"]');}});
window.addEventListener('hashchange',()=>syncHash(false));

// Highlight the section in view on wide-screen navigation without changing the shared URL.
let desktopScrollTick = 0;
function syncDesktopNav() {
  if (window.innerWidth <= 880) return;
  const boundary = (document.querySelector('.site-header')?.offsetHeight || 76) + 130;
  const sectionIds = ['home', 'features', 'download', 'about', 'help'];
  let visible = 'home';
  for (const id of sectionIds) {
    const section = document.getElementById(id);
    if (section && section.getBoundingClientRect().top <= boundary) visible = id;
  }
  if (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 8) visible = 'help';
  state.section = visible;
  document.querySelectorAll('.desktop-nav a[data-route]').forEach(link => {
    const current = link.dataset.route === visible;
    link.classList.toggle('active', current);
    if (current) link.setAttribute('aria-current', 'location');
    else link.removeAttribute('aria-current');
  });
}
function queueDesktopNav() {
  if (desktopScrollTick) return;
  desktopScrollTick = requestAnimationFrame(() => { desktopScrollTick = 0; syncDesktopNav(); });
}
window.addEventListener('scroll', queueDesktopNav, { passive: true });
window.addEventListener('resize',()=>{queueDesktopNav();initMotion();});
window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener?.('change',initMotion);
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){
  document.querySelectorAll('.geo-v2-hero-art,.security-geometry').forEach(el=>el.classList.remove('is-motion-active'));
  return;
 }
 initMotion();
});
window.matchMedia('(pointer:fine) and (hover:hover)').addEventListener?.('change',initMotion);

window.preview={state,go,setLanguage:l=>go(state.section,l),render,selectFaqCategory:cat=>{state.faqCat=cat;render()}};
const initial=parseHash();state.lang=initial.lang;state.section=initial.section;if(initial.safety)state.faqCat='security';render();syncHash(true);

</script></body></html>
